<!DOCTYPE html>
<html lang="VN">
<head>
    <meta charset="UTF-8">
    <title>PING PONG</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">

    <h1 class="title">PING PONG</h1>

    <div class="top-bar">
        <span class="stat">SCORE: <b id="scoreVal">0</b></span>
        <span class="stat">LVL: <b id="levelVal">1</b></span>
        <span class="stat">LIVES: <b id="livesVal">5</b></span>
    </div>

    <div id="gameArea">
        <div id="paddle"></div>
        <div id="ball"></div>
        <div id="bricks"></div>
    </div>

</div>

<script src="js/game.js"></script>
</body>
</html>
